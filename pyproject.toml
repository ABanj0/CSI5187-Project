[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premo-study"
version = "0.1.0"
description = "Guideline-driven LLM emotion annotation of PR discussions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
premo-study = "premo_study.cli:main"

[tool.setuptools.packages.find]
include = ["premo_study*"]

[tool.setuptools.package-data]
premo_study = ["prompts/*.txt"]
